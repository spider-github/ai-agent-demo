<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e7eb;
    font-weight: 600; font-size: 16px; color: #111;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 16px; }
  .user-bubble {
    background: #3b82f6; color: #fff; padding: 10px 14px; border-radius: 12px;
    display: inline-block; max-width: 85%; margin-left: auto;
  }
  .user-row { display: flex; justify-content: flex-end; }
  .agent-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px 16px; line-height: 1.7;
  }
  .thinking {
    color: #9ca3af; font-size: 13px; border-left: 3px solid #d1d5db;
    padding-left: 10px; margin: 6px 0; white-space: pre-wrap;
  }
  .thinking-label { font-size: 12px; color: #9ca3af; margin-bottom: 2px; }
  .tool-line { color: #0e7490; font-size: 13px; margin: 6px 0; }
  .obs { margin: 6px 0; font-size: 13px; }
  .obs summary { color: #1d4ed8; cursor: pointer; }
  .obs pre {
    background: #f3f4f6; padding: 8px; border-radius: 6px; margin-top: 4px;
    white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;
  }
  .answer { white-space: pre-wrap; margin-top: 8px; }
  .cursor { display: inline-block; width: 8px; background: #3b82f6; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { padding: 14px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
  .input-row { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #query {
    flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; outline: none;
  }
  #query:focus { border-color: #3b82f6; }
  #send {
    padding: 10px 22px; background: #3b82f6; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  #send:disabled { background: #93c5fd; cursor: not-allowed; }
</style>
</head>
<body>
<header>🤖 AI Agent（ReAct）流式问答</header>
<div id="chat"></div>
<footer>
  <div class="input-row">
    <input id="query" placeholder="输入你的问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const queryEl = document.getElementById('query');
const sendBtn = document.getElementById('send');
let busy = false;

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
function div(cls) { const d = document.createElement('div'); d.className = cls; return d; }

async function ask(q) {
  busy = true; sendBtn.disabled = true;
  // 用户消息
  const urow = div('msg user-row');
  const ub = div('user-bubble'); ub.textContent = q;
  urow.appendChild(ub); chatEl.appendChild(urow);

  // Agent 卡片：思考区 / 工具行 / 观察 / 正文
  const card = div('msg agent-card');
  const thinkWrap = div('thinking'); thinkWrap.style.display = 'none';
  const thinkLabel = document.createElement('div');
  thinkLabel.className = 'thinking-label'; thinkLabel.textContent = '💭 思考中…';
  const thinkText = document.createElement('span');
  thinkWrap.appendChild(thinkLabel); thinkWrap.appendChild(thinkText);
  const answerEl = div('answer');
  const cursor = document.createElement('span'); cursor.className = 'cursor'; cursor.innerHTML = '&nbsp;';
  card.appendChild(thinkWrap); card.appendChild(answerEl);
  chatEl.appendChild(card); scrollBottom();

  // SSE 接收
  const es = new EventSource('/chat?query=' + encodeURIComponent(q));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case 'thought':
        thinkWrap.style.display = 'block';
        thinkText.textContent += ev.text;
        scrollBottom();
        break;
      case 'tool': {
        const t = div('tool-line');
        t.textContent = `🔧 调用工具：${ev.name} | 参数：${JSON.stringify(ev.input)}`;
        card.insertBefore(t, answerEl);
        break;
      }
      case 'observation': {
        const d = document.createElement('details'); d.className = 'obs';
        d.innerHTML = '<summary>👁 查看观察结果</summary>';
        const pre = document.createElement('pre'); pre.textContent = ev.text;
        d.appendChild(pre);
        card.insertBefore(d, answerEl);
        break;
      }
      case 'answer_start':
        thinkLabel.textContent = '💭 思考过程';
        answerEl.appendChild(cursor);
        break;
      case 'answer':
        cursor.remove();
        answerEl.textContent = ev.text;   // 后端发的是累计全文，直接替换
        answerEl.appendChild(cursor);
        scrollBottom();
        break;
      case 'done':
        cursor.remove();
        es.close();
        busy = false; sendBtn.disabled = false; queryEl.focus();
        break;
    }
  };
  es.onerror = () => {
    es.close();
    if (busy) { busy = false; sendBtn.disabled = false; }
  };
}

function submit() {
  const q = queryEl.value.trim();
  if (!q || busy) return;
  queryEl.value = '';
  ask(q);
}

sendBtn.onclick = submit;
queryEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
queryEl.focus();
</script>
</body>
</html>
